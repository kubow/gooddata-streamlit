<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodData.UI Dashboard Component</title>
    <style>
        html, body, gd-dashboard-embed {
            margin: 0;
            width: 100%;
            min-height: 700px;
        }
    </style>
</head>
<body>
    <gd-dashboard-embed id="dashboard" readonly></gd-dashboard-embed>
    <script>
        function sendMessageToStreamlitClient(type, data) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data), "*");
        }

        function init() {
            sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
        }

        function renderDashboard(args) {
            if (!args || !args.script_url || !args.dashboard_id) return;
            const script = document.createElement("script");
            script.type = "module";
            script.src = args.script_url;
            document.head.appendChild(script);

            const dashboard = document.getElementById("dashboard");
            dashboard.setAttribute("dashboard", args.dashboard_id);
            if (args.workspace_id) dashboard.setAttribute("workspace", args.workspace_id);
        }

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                renderDashboard(event.data.args);
            }
        });

        init();
        window.addEventListener("load", function() {
            sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: 700});
        });
    </script>
</body>
</html>
